<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4bddb"><title>Cocolin塔羅｜免費線上塔羅</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 0% 50%,rgba(196,225,255,.38) 0%,transparent 22%),radial-gradient(ellipse at 100% 50%,rgba(196,225,255,.38) 0%,transparent 22%),linear-gradient(180deg,#fff0f8 0%,#ffdeee 55%,#ffeaf4 100%);background-attachment:fixed;color:#553c63;font:16px system-ui,'Noto Sans TC',sans-serif}main{max-width:740px;margin:auto;padding:25px 15px}header{text-align:center}h1{font-size:32px}p{line-height:1.7;color:#765f83}nav{display:flex;gap:6px;overflow:auto;margin:24px 0}button{cursor:pointer;font:inherit;color:#583e67;background:#fce5f3;border:1px solid #d4b9e5;border-radius:12px;padding:12px}nav button{flex:1;white-space:nowrap;font-size:13px;padding:10px 5px}button.active,.primary{background:linear-gradient(110deg,#f7a9d5 0%,#f6bfdf 83%,#d9eaff 100%);color:#4d365d;font-weight:bold}.panel{border:1px solid #e6c9e9;border-radius:18px;padding:20px;background:rgba(255,255,255,.76);box-shadow:0 10px 30px rgba(166,124,174,.12);margin-bottom:20px}section{display:none}section.active{display:block}.center{text-align:center}.cards{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:20px 0}.card{display:flex;flex-direction:column;justify-content:space-between;align-items:center;width:145px;height:210px;padding:15px 6px;text-align:center;border:2px solid #f9d9f0;border-radius:12px;background:linear-gradient(145deg,#ffbdda 0%,#f9d3e8 80%,#dcecff 100%);box-shadow:0 6px 16px rgba(140,129,178,.18)}.card b{font-size:17px}.card .symbol{font-size:48px;color:#795da2}.card small{font-size:10px;color:#604c78}.cards .card{width:30%;min-width:85px;height:185px}.cards .card .symbol{font-size:35px}.cards .card b{font-size:14px}.back{justify-content:center;font-size:48px;color:#9d79b5}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px}.grid button{text-align:left}input,textarea,select{width:100%;padding:12px;margin:8px 0 14px;border:1px solid #d9b7df;border-radius:10px;background:#fff9fd;color:#553c63;font:inherit}.entry{border-bottom:1px solid #e5d3ec;padding:12px 0}footer{text-align:center;font-size:12px;color:#826d91;margin:35px 0}#detail .card,#dailyResult .card{margin:15px auto}label{display:block}header h1{color:#6d4d86}h2{color:#71528a}button:hover{filter:brightness(.98)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #7bbbe9;outline-offset:2px}</style><main><header><div style="color:#9d79b5;letter-spacing:3px;font-size:12px">COCOLIN TAROT</div><div style="font-size:42px;color:#9d79b5">☾ ✧</div><h1>Cocolin塔羅</h1><p>聽見內心的聲音，找到今天的方向</p></header><nav><button class="active" data-tab="daily">每日抽牌</button><button data-tab="three">三張牌</button><button data-tab="guide">牌義圖鑑</button><button data-tab="notes">占卜紀錄</button></nav><section id="daily" class="active"><div class="panel center"><h2>今日塔羅</h2><p>每天固定一張牌，陪妳整理今天的心情。</p><div id="dailyResult"></div><button class="primary" id="drawDaily">抽取今日牌卡</button></div></section><section id="three"><div class="panel center"><h2>三張牌探索</h2><p>默想一個問題，看看過去、現在與下一步。</p><label for="topic">占卜主題</label><select id="topic"><option>感情</option><option>工作</option><option>人際與成長</option></select><div id="threeResult"><div class="cards"><div class="card back">☾</div><div class="card back">☾</div><div class="card back">☾</div></div></div><button class="primary" id="drawThree">洗牌並抽三張</button></div></section><section id="guide"><div class="panel"><h2>22張大阿爾克那圖鑑</h2><p>第一版先收錄22張大牌，之後可擴充到78張。</p><div class="grid" id="grid"></div><div id="detail"></div></div></section><section id="notes"><div class="panel"><h2>占卜紀錄</h2><p>資料只儲存在妳目前使用的瀏覽器中；清除瀏覽資料可能遺失。請勿記錄敏感個資。</p><label for="note">今天的問題或心得</label><textarea id="note" rows="4" maxlength="500" placeholder="寫下今天想記住的事情……"></textarea><button class="primary" id="save">儲存心得</button><div id="entries"></div><button id="clear">清除所有紀錄</button></div></section><footer>Cocolin塔羅｜免費自我探索工具<br>牌卡解讀僅供娛樂及自我反思，不代替醫療、法律或財務等專業建議。</footer></main><script>
const raw=[['愚者','新的開始','保持好奇心，勇敢嘗試，但也記得評估風險。'],['魔術師','創造與行動','善用手邊資源，將想法轉成小小的行動。'],['女祭司','直覺與觀察','先觀察，再決定是否採取行動。'],['皇后','滋養與成長','照顧自己，也給新計畫時間成長。'],['皇帝','秩序與界線','建立清楚界線，讓生活更穩定。'],['教皇','學習與指引','從可靠的經驗與方法中學習。'],['戀人','關係與選擇','選擇時兼顧感受與長期價值。'],['戰車','方向與決心','確立方向後穩定前進。'],['力量','溫柔與勇氣','用耐心面對挑戰，不必急於求成。'],['隱者','沉澱與思考','留一些安靜時間釐清想法。'],['命運之輪','變化與機會','保持彈性，準備迎接變化。'],['正義','公平與責任','以事實衡量選擇和後果。'],['倒吊人','換位思考','換個角度看待眼前的問題。'],['死神','結束與轉變','放下不再適合的事，迎接新階段。'],['節制','平衡與調整','用小幅調整找到適合自己的節奏。'],['惡魔','束縛與習慣','留意哪些習慣正在限制自己。'],['高塔','打破框架','面對突發變化，先穩住基本需求。'],['星星','希望與修復','把希望轉化為今天能做的一件事。'],['月亮','感受與不確定','看見情緒，也用事實核對猜測。'],['太陽','清晰與活力','肯定進步，分享努力的成果。'],['審判','覺察與更新','整理過去經驗，決定下一步。'],['世界','完成與整合','肯定完成的里程碑，迎接新循環。']];
const $=id=>document.getElementById(id),symbols=['✧','✦','☾','❀','♜','✥','♡','➶','♌','☼','◌','⚖','⌛','✿','⚗','⛓','⚡','✧','☾','☀','✺','◎'];const cards=raw.map((r,i)=>({id:i,name:r[0],theme:r[1],advice:r[2]}));const card=c=>`<div class="card"><small>${String(c.id).padStart(2,'0')} · TAROT</small><span class="symbol">${symbols[c.id]}</span><b>${c.name}</b></div>`;const explain=c=>`<h3>${c.name}｜${c.theme}</h3><p>${c.advice}</p>`;
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('section').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))}));
$('drawDaily').onclick=()=>{const d=new Date(),date=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;let hash=0;for(const x of date)hash=(hash*31+x.charCodeAt(0))>>>0;const c=cards[hash%cards.length];$('dailyResult').innerHTML=card(c)+explain(c)+`<p>日期：${date}</p>`};
$('drawThree').onclick=()=>{let ids=cards.map(c=>c.id);for(let i=ids.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}const picked=ids.slice(0,3).map(i=>cards[i]);$('threeResult').innerHTML=`<div class="cards">${picked.map(card).join('')}</div>`+picked.map((c,i)=>`<div style="text-align:left;border-top:1px solid #715689;padding-top:8px"><strong>${['過去','現在','下一步'][i]}</strong>${explain(c)}</div>`).join('');window.lastCards=picked.map(c=>c.name).join('、')};
$('grid').innerHTML=cards.map(c=>`<button data-card="${c.id}">${String(c.id).padStart(2,'0')} · ${c.name}</button>`).join('');$('grid').onclick=e=>{let b=e.target.closest('[data-card]');if(!b)return;let c=cards[+b.dataset.card];$('detail').innerHTML=card(c)+explain(c)};
const key='moon-tarot-notes-v1';const read=()=>{try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}};function render(){const root=$('entries');root.replaceChildren();const entries=read();if(!entries.length){root.textContent='尚無紀錄';return}for(const x of entries){const div=document.createElement('div');div.className='entry';const b=document.createElement('b');b.textContent=x.date;const p=document.createElement('p');p.textContent=x.text;div.append(b,p);if(x.cards){const s=document.createElement('small');s.textContent='抽牌：'+x.cards;div.append(s)}root.append(div)}}$('save').onclick=()=>{const text=$('note').value.trim();if(!text)return alert('請先填寫心得');try{const e=read();e.unshift({date:new Date().toLocaleString('zh-TW'),text,cards:window.lastCards||''});localStorage.setItem(key,JSON.stringify(e.slice(0,100)));$('note').value='';render();alert('已儲存於此瀏覽器')}catch{alert('儲存失敗，請確認瀏覽器允許網站儲存')}};$('clear').onclick=()=>{if(confirm('確定清除所有紀錄？')){localStorage.removeItem(key);render()}};render();
</script></html>
